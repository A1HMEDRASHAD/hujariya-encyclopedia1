<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>موسوعة الحجرية | المكتبة الوطنية</title>
    
    <!-- خطوط عربية احترافية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة أيقونات Boxicons (احترافية وخفيفة) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- إعدادات تطبيق الويب (PWA) -->
    <meta name="theme-color" content="#1b302b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="light-mode">

    <!-- الهيدر (الشعار والبحث والتصنيفات) -->
    <header class="main-header">
        <div class="top-bar">
            <div class="brand">
                <img src="https://ibb.co/4wfWtyZ7" alt="شعار موسوعة الحجرية" class="brand-logo">
                <div class="brand-text">
                    <h1>موسوعة الحجرية</h1>
                    <p>المكتبة الوطنية الرقمية</p>
                </div>
            </div>
            <!-- أيقونة الإشعارات أو التنبيهات (اختياري للمستقبل) -->
            <button class="icon-btn"><i class='bx bx-bell'></i></button>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class='bx bx-search search-icon'></i>
                <input type="text" id="searchInput" placeholder="ابحث عن كتاب أو مؤلف يمني...">
            </div>
        </div>

        <!-- تبويبات التصنيفات (تمرير سلس) -->
        <div class="categories-scroll-wrapper">
            <div class="categories-tabs" id="categoriesTabs">
                <button class="cat-tab active" data-cat="all">الكل</button>
                <button class="cat-tab" data-cat="روايات وأدب">روايات وأدب</button>
                <button class="cat-tab" data-cat="تاريخ وتراث يمني">تاريخ وتراث</button>
                <button class="cat-tab" data-cat="شعر ودواوين">شعر ودواوين</button>
                <button class="cat-tab" data-cat="فكر وفلسفة">فكر وفلسفة</button>
                <button class="cat-tab" data-cat="علوم وأبحاث">علوم وأبحاث</button>
                <button class="cat-tab" data-cat="سير وتراجم">سير وتراجم</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموسوعة -->
    <main class="main-content">
        
        <!-- صفحة الرفوف (الرئيسية) -->
        <section id="shelvesView" class="view-section active-view">
            <div class="section-title">
                <h3><i class='bx bx-book-open'></i> الرفوف الوطنية</h3>
                <span id="booksCountText" class="count-badge">0 كتاب</span>
            </div>
            <div id="mainBookshelf" class="bookshelf-grid">
                <!-- الكتب تظهر هنا -->
            </div>
        </section>

        <!-- صفحة مكتبتي -->
        <section id="myLibraryView" class="view-section">
            <div class="section-title">
                <h3><i class='bx bx-bookmark-heart'></i> مكتبتي الخاصة</h3>
            </div>
            <div id="savedBooksShelf" class="bookshelf-grid">
                <!-- الكتب المحفوظة تظهر هنا -->
            </div>
        </section>

        <!-- صفحة الحساب والإعدادات -->
        <section id="profileView" class="view-section">
            <div class="profile-header">
                <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=random&color=fff" alt="الصورة الشخصية" class="avatar-large">
                <h2 id="profileName">زائر</h2>
                <p id="profileEmail" class="text-muted">يرجى تسجيل الدخول</p>
                <button id="authActionBtn" class="btn-primary mt-3"><i class='bx bxl-google'></i> تسجيل الدخول بجوجل</button>
            </div>

            <div class="settings-group mt-4">
                <h4><i class='bx bx-cog'></i> إعدادات التطبيق</h4>
                <div class="setting-item">
                    <div class="setting-info">
                        <i class='bx bx-moon'></i>
                        <span>الوضع الليلي</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="darkModeToggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item" id="installAppBtn" style="display:none; cursor:pointer;">
                    <div class="setting-info">
                        <i class='bx bx-download'></i>
                        <span>تثبيت التطبيق (PWA)</span>
                    </div>
                    <i class='bx bx-chevron-left'></i>
                </div>
            </div>

            <!-- خيارات الإدارة (تظهر فقط للإدارة) -->
            <div id="adminSettingsGroup" class="settings-group mt-4" style="display:none;">
                <h4 style="color:var(--danger-color);"><i class='bx bx-shield-quarter'></i> إدارة الموسوعة</h4>
                <button id="goToAdminPanelBtn" class="btn-danger w-100"><i class='bx bx-list-check'></i> فتح لوحة المراجعة والطلبات <span id="pendingBadge" class="badge">0</span></button>
            </div>
        </section>

        <!-- صفحة لوحة الإدارة (مخفية إلا للمدير) -->
        <section id="adminView" class="view-section">
            <div class="section-title">
                <h3><i class='bx bx-shield-quarter'></i> الكتب بانتظار المراجعة</h3>
            </div>
            <div id="pendingBooksList" class="admin-list">
                <!-- الكتب المعلقة تظهر هنا -->
            </div>
        </section>

    </main>

    <!-- شريط التنقل السفلي التفاعلي (الفقاعة) -->
    <nav class="bottom-nav">
        <div class="nav-container">
            <button class="nav-item active" data-target="shelvesView">
                <i class='bx bx-home-alt'></i>
                <span>الرئيسية</span>
            </button>
            <button class="nav-item" data-target="myLibraryView">
                <i class='bx bx-bookmark'></i>
                <span>مكتبتي</span>
            </button>
            <!-- زر النشر العائم (في المنتصف) -->
            <button class="nav-fab" id="openAddModalBtn">
                <i class='bx bx-plus'></i>
            </button>
            <button class="nav-item" data-target="adminView" id="adminNavBtn" style="display:none;">
                <i class='bx bx-shield'></i>
                <span>الإدارة</span>
            </button>
            <button class="nav-item" data-target="profileView">
                <i class='bx bx-user'></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <!-- نافذة رفع وإضافة كتاب -->
    <div id="addBookModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class='bx bx-layer-plus'></i> مساهمة بكتاب</h3>
                <button class="close-btn" id="closeAddModal"><i class='bx bx-x'></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>عنوان الكتاب *</label>
                    <input type="text" id="bookTitleInput" class="form-control" placeholder="اكتب العنوان...">
                </div>
                <div class="form-group">
                    <label>المؤلف *</label>
                    <input type="text" id="bookAuthorInput" class="form-control" placeholder="اسم الكاتب...">
                </div>
                <div class="form-group">
                    <label>التصنيف *</label>
                    <select id="bookCategoryInput" class="form-control">
                        <option value="روايات وأدب">روايات وأدب</option>
                        <option value="تاريخ وتراث يمني">تاريخ وتراث يمني</option>
                        <option value="شعر ودواوين">شعر ودواوين</option>
                        <option value="فكر وفلسفة">فكر وفلسفة</option>
                        <option value="علوم وأبحاث">علوم وأبحاث</option>
                        <option value="سير وتراجم">سير وتراجم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نبذة عن الكتاب *</label>
                    <textarea id="bookDescInput" class="form-control" rows="3" placeholder="وصف قصير..."></textarea>
                </div>
                <div class="form-group">
                    <label>رابط التحميل (درايف) - اختياري</label>
                    <input type="url" id="bookDriveInput" class="form-control" placeholder="https://drive.google.com/...">
                </div>
                <div class="form-group">
                    <label>صورة الغلاف *</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="bookCoverInput" accept="image/*" class="file-input">
                        <div class="file-upload-box">
                            <i class='bx bx-cloud-upload'></i>
                            <span>اضغط لاختيار صورة الغلاف</span>
                        </div>
                    </div>
                </div>
                <p id="uploadStatusMsg" class="status-msg"></p>
                <button id="submitBookBtn" class="btn-primary w-100"><i class='bx bx-send'></i> إرسال للمراجعة</button>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل الكتاب -->
    <div id="bookDetailsModal" class="modal-overlay">
        <div class="modal-box modal-large">
            <div class="modal-header">
                <h3>تفاصيل الكتاب</h3>
                <button class="close-btn" id="closeDetailsModal"><i class='bx bx-x'></i></button>
            </div>
            <div class="modal-body book-details-body">
                <!-- يُملأ برمجياً -->
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
